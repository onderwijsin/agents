interface:
  display_name: code documentation
  short_description: Use this skill when the user requests to generate, create, or
    improve documentation for code, APIs, libraries, repositories, or software projects.
    Supports README generation, API reference documentation, inline code comments,
    architecture documentation, changelog generation, and developer guides. Trigger
    on requests like "document this code", "create a README", "generate API docs",
    "write developer guide", or when analyzing codebases for documentation purposes.
  icon_small: assets/icon.svg
  icon_large: assets/icon.svg
policy:
  products:
    - chatgpt
    - codex
    - api
    - atlas
  allow_implicit_invocation: true
