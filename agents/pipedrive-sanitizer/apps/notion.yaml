account_type: agent-owned
action_safety: allow-low-risk
safety_constraints: []
write_actions: true
read_actions: true
capability_description: >-
  Read and selectively modify Notion content using an agent-owned
  connection, within the connected account's existing permissions.

  Read access is focused on retrieving Notion pages, databases,
  data sources, comments, and relevant workspace metadata.
  The agent can search accessible content, retrieve page details,
  and query structured data across one or multiple Notion data sources.

  Write access is limited to creating and updating Notion pages.
  This is intended for recording and maintaining Pipedrive
  Sanitizer results, reports, and operational documentation.

  All other write operations are disabled. The agent cannot
  create or modify database schemas, manage database views,
  move or delete pages, manage folders, upload attachments,
  modify comments, or change workspace settings.

  Access to unrelated services and features, including calendars,
  email, personal memories, agent sessions, Notion Skills,
  and XL database management, is disabled.

  The intended scope is retrieving reference data and maintaining
  sanitizer-related pages. Enabled page-writing tools are not
  technically restricted to specific pages or databases.

  Access is governed by the currently enabled tools, the
  connected account's Notion permissions, and the configured
  low-risk action safety policy. Newly introduced tools should
  follow these capability boundaries rather than being
  implicitly permitted.
