name: Prepare release
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]
env:
  HUSKY: 0
permissions:
  contents: read
concurrency:
  group: prepare-release-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  prepare:
    outputs:
      prepared_sha: ${{ steps.versions.outputs.sha }}
    # Forks use the local preparation command; never grant writes to fork code.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
    steps:
      # Execute only the base branch's release script, reading PR contents as Git objects.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Synchronize references and prepare versions
        id: versions
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          RELEASE_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          git fetch origin "$HEAD"
          prepared=$(node scripts/release.ts prepare "$BASE" "$HEAD")
          echo "sha=$prepared" >> "$GITHUB_OUTPUT"
      - name: Push prepared commit for PR validation
        env:
          GH_TOKEN: ${{ github.token }}
          PREPARED: ${{ steps.versions.outputs.sha }}
          EXPECTED: ${{ github.event.pull_request.head.sha }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # A stale run must not update a newer branch.
          current=$(gh pr view "$PR" --json headRefOid --jq .headRefOid)
          test "$current" = "$EXPECTED"
          gh auth setup-git
          if test "$PREPARED" != "$EXPECTED"; then
            git push origin "$PREPARED:refs/heads/$BRANCH"
            # GitHub requires approval before running CI for a GITHUB_TOKEN PR update.
            echo "Prepared commit: $PREPARED. Approve workflows to run on the PR." >> "$GITHUB_STEP_SUMMARY"
          fi
  validate:
    needs: prepare
    # Skip only a successful handoff to a newer commit. Failures still reach the guard.
    # The new PR run must validate its own head after GitHub workflow approval.
    if: >-
      always() &&
      (needs.prepare.result != 'success' ||
       needs.prepare.outputs.prepared_sha == github.event.pull_request.head.sha)
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require successful preparation
        env:
          SAME_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          PREPARATION_RESULT: ${{ needs.prepare.result }}
          PREPARED: ${{ needs.prepare.outputs.prepared_sha }}
          EXPECTED: ${{ github.event.pull_request.head.sha }}
        run: |
          if test "$SAME_REPOSITORY" = true; then
            test "$PREPARATION_RESULT" = success
            test "$PREPARED" = "$EXPECTED"
          fi
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migrate references
        run: pnpm references:sync
      - name: Require committed migration output
        run: |
          git diff --exit-code -- plugins/
          test -z "$(git ls-files --others --exclude-standard -- plugins/)"
      - name: Validate migrated resources
        run: pnpm check
      - name: Check plugin versions before merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          EXPECTED: ${{ github.event.pull_request.head.sha }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          # Labels are mutable: validate against current PR state, including approved bot updates.
          gh pr view "$PR" --json labels,headRefOid,baseRefName > "$RUNNER_TEMP/release-pr.json"
          test "$(jq -r .headRefOid "$RUNNER_TEMP/release-pr.json")" = "$EXPECTED"
          test "$(jq -r .baseRefName "$RUNNER_TEMP/release-pr.json")" = main
          export RELEASE_LABELS=$(jq -c '[.labels[].name]' "$RUNNER_TEMP/release-pr.json")
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          git merge-base --is-ancestor "$BASE" HEAD
          node scripts/release.ts check origin/main HEAD
